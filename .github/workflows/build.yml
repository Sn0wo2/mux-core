name: Rust Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
      version:
        type: string
      snapshot:
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: workspace/mux-core

jobs:
  build:
    name: Build library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
          path: workspace/mux-core

      - uses: ./workspace/mux-core/.github/actions/setup-path-dependencies

      - name: Install cargo-edit
        if: ${{ !inputs.snapshot }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Sync workspace version
        if: ${{ !inputs.snapshot }}
        env:
          VERSION: ${{ inputs.version }}
        run: cargo set-version --workspace "$VERSION"

      - name: Set up Rust
        if: ${{ inputs.version == '' }}
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: ${{ inputs.version == '' }}
        with:
          workspaces: workspace/mux-core -> target
          shared-key: ${{ github.event.repository.name }}-cargo
          cache-on-failure: true

      - name: Build library
        if: ${{ inputs.version == '' }}
        run: make build

      - name: Package source archive
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.snapshot && 'release-snapshot' || 'release' }}
        run: make "$RELEASE_TARGET"

      - name: Upload source archive
        if: ${{ inputs.version != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-library-builds
          path: workspace/mux-core/dist/*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.snapshot && 7 || 30 }}
