name: Rust Tests

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: workspace/mux-core

jobs:
  test:
    name: Test feature configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: workspace/mux-core
      - uses: ./workspace/mux-core/.github/actions/setup-path-dependencies
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace/mux-core -> target
          shared-key: ${{ github.event.repository.name }}-cargo
          cache-on-failure: true
      - name: Run tests
        run: make test test-all test-no-default
