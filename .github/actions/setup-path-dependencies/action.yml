name: Set up path dependencies
description: Check out the Rust workspace path dependencies for mux-core
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: Sn0wo2/h2mux-rs
        ref: a8e6e6a9dc30232a894a3bf09be31260c4c4b847
        path: workspace/h2mux-rs
        persist-credentials: false
    - uses: actions/checkout@v7
      with:
        repository: Sn0wo2/mux-cool-rs
        ref: d13179d08ccee42457c0fef79a424896351b982e
        path: workspace/mux-cool-rs
        persist-credentials: false
